name: Verify portable static release
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Beep.SimpleDraw
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: Beep.SimpleDraw
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Beep.SimpleDraw/global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Install SDK manifest WASM tools
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          if ($LASTEXITCODE -ne 0) { throw 'WASM workload installation failed.' }
          ./scripts/verify-toolchain.ps1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Beep.SimpleDraw/artifacts/packages
          key: windows-2025-nuget-${{ hashFiles('Beep.SimpleDraw/global.json', 'Beep.SimpleDraw/dependencies/**', 'Beep.SimpleDraw/**/packages.net10.lock.json', 'Beep.SimpleDraw/NuGet.Config') }}
      - name: Prepare, test and package
        run: ./scripts/build.ps1 -Output artifacts/ci-release
      - name: Upload static payload and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simpledraw-static-and-verification
          path: Beep.SimpleDraw/artifacts/ci-release
          if-no-files-found: warn
          retention-days: 14
